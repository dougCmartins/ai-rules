name: 🔁 Sync AI Rules to Projects

on:
  workflow_dispatch: # Executado manualmente pelo GitHub Actions
  push:
    branches:
      - main # Sincroniza automaticamente se alterar algo na main
    paths:
      - '.cursor/rules/**'
      - 'GUIA_ENGENHARIA_LIMPA.md'
      - 'CLAUDE.md'
      - '.github/copilot-instructions.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Repositórios de destino
        target: [landing-page, conecta_huggy, desafio-dev]
      fail-fast: false

    steps:
      - name: Checkout AI Rules Repo
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "ai-rules-bot"
          git config --global user.email "bot@ai-rules.local"

      - name: Sync to ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ORG: dougCmartins       # Substitua se o repo estiver em outra org/usuário
          TARGET_REPO: ${{ matrix.target }}
          TARGET_BRANCH: main     # Branch padrão dos projetos alvo
        run: |
          echo "🚀 Iniciando sync para $ORG/$TARGET_REPO..."
          
          # 1. Faz o clone do repositório de destino para a pasta tmp
          git clone https://x-access-token:${GH_TOKEN}@github.com/${ORG}/${TARGET_REPO}.git tmp/$TARGET_REPO -b $TARGET_BRANCH --single-branch
          
          # 2. Entra na pasta clonada e prepara a estrutura de diretórios
          cd tmp/$TARGET_REPO || exit 1
          
          mkdir -p .cursor/rules
          mkdir -p .github
          
          # 3. Copia todas as regras, guias e instruções de IA para o destino
          cp -r ../../.cursor/rules/* .cursor/rules/
          cp ../../CLAUDE.md ./CLAUDE.md
          cp ../../.github/copilot-instructions.md .github/copilot-instructions.md
          cp ../../GUIA_ENGENHARIA_LIMPA.md ./GUIA_ENGENHARIA_LIMPA.md || true
          
          # 4. Adiciona os arquivos ao Git
          git add .cursor/rules .github/copilot-instructions.md CLAUDE.md GUIA_ENGENHARIA_LIMPA.md || true
          
          # 5. Verifica se houve alterações e faz commit/push
          if git diff --staged --quiet; then
            echo "✅ Nenhuma alteração necessária. O repositório já está atualizado."
          else
            git commit -m "chore: sincroniza regras de engenharia e configuracoes de IA"
            git push origin $TARGET_BRANCH
            echo "🔄 Regras atualizadas com sucesso em $TARGET_REPO."
          fi
          
          cd ../..
          
          # 6. Limpa o diretório temporário
          rm -rf tmp/$TARGET_REPO
          echo "✅ Finalizado com sucesso para $ORG/$TARGET_REPO."