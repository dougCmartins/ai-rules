name: 🔁 Sync AI Rules to Projects

on:
  workflow_dispatch: # Executado manualmente pelo GitHub Actions
  push:
    branches:
      - main # (Opcional) Sincroniza automaticamente se alterar algo na main
    paths:
      - '.cursor/rules/**'
      - 'GUIA_ENGENHARIA_LIMPA.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Substitua pelos nomes reais dos seus repositórios no GitHub
        target: [landing-page, conecta_huggy, desafio-dev][cite: 30]
      fail-fast: false

    steps:
      - name: Checkout AI Rules Repo
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "ai-rules-bot"
          git config --global user.email "bot@ai-rules.local"

      - name: Sync to ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}[cite: 30]
          ORG: dougCmartins       # <-- Atenção: Se o repositório alvo estiver noutra organização, altere aqui!
          TARGET_REPO: ${{ matrix.target }}[cite: 30]
          TARGET_BRANCH: main     # Confirme se a branch dos projetos é 'main' ou 'master'[cite: 30]
        run: |
          echo "🚀 Iniciando sync para $ORG/$TARGET_REPO..."
          
          # 1. Faz o clone do repositório de destino para a pasta tmp
          git clone https://x-access-token:${GH_TOKEN}@github.com/${ORG}/${TARGET_REPO}.git tmp/$TARGET_REPO -b $TARGET_BRANCH --single-branch[cite: 30]
          
          # 2. Copia as regras e o guia para garantir que o caminho fica perfeitamente alinhado
          mkdir -p tmp/$TARGET_REPO/.cursor
          cp -r .cursor/rules tmp/$TARGET_REPO/.cursor/
          cp GUIA_ENGENHARIA_LIMPA.md tmp/$TARGET_REPO/ || true
          
          # 3. Entra na pasta clonada e faz o commit/push apenas se houver alterações
          cd tmp/$TARGET_REPO || exit 1[cite: 30]
          
          git add .cursor/rules GUIA_ENGENHARIA_LIMPA.md
          
          if git diff --staged --quiet; then
            echo "✅ Nenhuma alteração necessária. O repositório já está atualizado."
          else
            git commit -m "chore: sincroniza regras de engenharia (cursor rules)"
            git push origin $TARGET_BRANCH
            echo "🔄 Regras atualizadas com sucesso em $TARGET_REPO."
          fi
          
          # 4. Limpa o diretório temporário[cite: 30]
          cd ../..[cite: 30]
          rm -rf tmp/$TARGET_REPO[cite: 30]